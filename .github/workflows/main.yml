name: Deploy myapplication

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
        continue-on-error: false
      
      - name: Build application
        run: npm run build
        if: success()
      
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Deploying myapplication..."
          # Add your deployment commands here
          # Examples:
          # - Deploy to AWS: aws s3 sync ./build s3://your-bucket
          # - Deploy to Heroku: git push heroku main
          # - Deploy to VPS: scp -r ./build user@server:/path/to/app
          # - Deploy to Vercel: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # Add your deployment secrets here
          # DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          # API_TOKEN: ${{ secrets.API_TOKEN }}
          NODE_ENV: production
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
